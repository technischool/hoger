<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת בדיקת פטורים</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #0a192f; 
        }
        .card {
            width: 90%;
            max-width: 500px;
            text-align: center;
            background: white;
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        h1 { color: #1f2937; margin-bottom: 20px; font-size: 24px; }
        .status-text { font-size: 13px; color: #6b7280; margin-bottom: 15px; font-weight: bold; }
        
        /* פאנל שליטה קומפקטי (מצלמה + מקלדת) */
        .control-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
            justify-content: space-between;
        }
        .control-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            text-align: right;
        }
        .control-item label {
            font-size: 11px;
            color: #4b5563;
            margin-bottom: 3px;
            font-weight: bold;
        }
        .cam-select, .manual-input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 2px solid #1e3a8a;
            font-size: 0.9rem;
            background-color: #f9fafb;
            color: #1f2937;
            box-sizing: border-box;
            height: 38px;
        }
        
        /* קבוצת הזנה ידנית קומפקטית */
        .input-group {
            display: flex;
            gap: 4px;
        }
        .input-btn {
            background-color: #1e3a8a;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 12px;
            cursor: pointer;
            font-weight: bold;
            height: 38px;
            font-size: 1rem;
        }

        /* מסך הבית - כפתורים גדולים ונגישים */
        #menu-screen { display: flex; flex-direction: column; gap: 15px; }
        .menu-btn {
            background-color: #1e3a8a; color: white; border: none; padding: 20px;
            font-size: 1.3rem; font-weight: bold; border-radius: 12px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: opacity 0.2s;
        }
        .menu-btn:active { opacity: 0.8; }

        /* מסך הסורק */
        #scanner-screen { display: none; }
        #reader { width: 100%; border-radius: 10px; overflow: hidden; border: none !important; }
        #reader button { display: none !important; }

        /* כפתור החלפה מהירה בתחתית */
        .switch-btn {
            background-color: #f3f4f6; border: 2px solid #1e3a8a; color: #1e3a8a; padding: 12px 20px;
            border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 15px; width: 100%;
            font-size: 1rem;
        }

        /* מסך תוצאה מלא */
        #result-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            flex-direction: column; align-items: center; justify-content: center; z-index: 9999;
            color: white; text-align: center;
        }
        #result-title { font-size: 3.5rem; margin: 0; font-weight: bold; }
        #result-sub { font-size: 1.8rem; margin: 10px 0; opacity: 0.9; }
        #result-code { font-size: 1.3rem; margin: 0 0 40px 0; opacity: 0.7; }
        #reset-btn {
            background: white; color: black; border: none; padding: 15px 45px;
            font-size: 1.3rem; font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="menu-screen" class="card">
        <h1>מערכת בדיקת פטורים</h1>
        <button class="menu-btn" onclick="selectMode('beard')">בדיקת פטור זקן</button>
        <button class="menu-btn" onclick="selectMode('hair')">בדיקת פטור שיער</button>
    </div>

    <div id="scanner-screen" class="card">
        <h1 id="scanner-title">סורק</h1>
        
        <div class="control-row">
            <div class="control-item" style="flex: 1.2;">
                <label for="camera-select">🎥 בחר מצלמה:</label>
                <select id="camera-select" class="cam-select" onchange="onCameraChange()"></select>
            </div>
            
            <div class="control-item" style="flex: 1;">
                <label for="manual-barcode">⌨️ הזנה ידנית:</label>
                <div class="input-group">
                    <input type="tel" id="manual-barcode" class="manual-input" placeholder="מ.א / קוד" pattern="[0-9]*">
                    <button class="input-btn" onclick="submitManualCode()">➔</button>
                </div>
            </div>
        </div>

        <div id="status-text" class="status-text">מאתחל מערכת...</div>
        <div id="reader"></div>
        <button id="quick-switch-btn" class="switch-btn" onclick="toggleMode()">מעבר לבדיקה שנייה...</button>
    </div>

    <div id="result-screen">
        <h2 id="result-title"></h2>
        <div id="result-sub"></div>
        <p id="result-code"></p>
        <button id="reset-btn" onclick="resetScanner()">סרוק כרטיס הבא</button>
    </div>

    <script>
        // ========================================================
        // ⚠️ הקישורים שלך - הדבק אותם ממש כאן (שמור על המרכאות!)
        // ========================================================
        const urlBeardSheet = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQrdgt4ZneC376JbsyxK4aXb_5dmq67zJWZo96WTZ2pKW8HV7eLPXn2a5B8KMmiHAjoaGV4p-U10YCr/pub?output=csv"; 
        const urlHairSheet = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRoy_KcjTmaxtQGXGd00oe1rtF_QI_oXjhgeI-UAkQeskU8Ujw13ehzjxUoqM_XTFczg4EdRwf9-4A8/pub?output=csv"; 
        // ========================================================

        let validBarcodes = [];
        let html5QrCode = null;
        let currentMode = ''; 
        let isProcessing = false;
        let selectedCameraId = null;

        // פונקציה לבחירת המצב - מוגנת מנפילות
        async function selectMode(mode) {
            try {
                // 1. החלפת מסך מיידית ללא תלות בכלום
                currentMode = mode;
                document.getElementById('menu-screen').style.display = 'none';
                document.getElementById('scanner-screen').style.display = 'block';
                document.getElementById('status-text').innerText = "מבקש גישה למצלמה...";
                
                // 2. הפעלת מנועי המצלמה והנתונים
                await getAndPopulateCameras();
                await updateUiAndLoad();
            } catch (err) {
                console.error("שגיאה קריטית בטעינה:", err);
                document.getElementById('status-text').innerText = "❌ שגיאה במערכת. רענן את הדף.";
            }
        }

        function getAndPopulateCameras() {
            return new Promise((resolve, reject) => {
                Html5Qrcode.getCameras().then(cameras => {
                    const selectEl = document.getElementById('camera-select');
                    selectEl.innerHTML = ""; 

                    if (cameras && cameras.length > 0) {
                        cameras.forEach((camera, index) => {
                            const option = document.createElement('option');
                            option.value = camera.id;
                            option.text = camera.label || `מצלמה ${index + 1}`;
                            selectEl.appendChild(option);
                        });
                        
                        selectEl.selectedIndex = cameras.length - 1;
                        selectedCameraId = selectEl.value;
                        
                        startCamera(selectedCameraId).then(() => resolve()).catch(reject);
                    } else {
                        document.getElementById('status-text').innerText = "⚠️ לא נמצאו מצלמות";
                        resolve();
                    }
                }).catch(err => {
                    document.getElementById('status-text').innerText = "⚠️ הגישה למצלמה נחסמה";
                    resolve();
                });
            });
        }

        function startCamera(cameraId) {
            return new Promise((resolve, reject) => {
                const config = { fps: 15, qrbox: { width: 280, height: 160 } };
                if (html5QrCode) {
                    html5QrCode.stop().then(() => {
                        html5QrCode = new Html5Qrcode("reader");
                        html5QrCode.start(cameraId, config, onScanSuccess).then(resolve).catch(reject);
                    }).catch(() => {
                        html5QrCode = new Html5Qrcode("reader");
                        html5QrCode.start(cameraId, config, onScanSuccess).then(resolve).catch(reject);
                    });
                } else {
                    html5QrCode = new Html5Qrcode("reader");
                    html5QrCode.start(cameraId, config, onScanSuccess).then(resolve).catch(reject);
                }
            });
        }

        async function onCameraChange() {
            try {
                const selectEl = document.getElementById('camera-select');
                selectedCameraId = selectEl.value;
                document.getElementById('status-text').innerText = "מחליף מצלמה...";
                await startCamera(selectedCameraId);
                document.getElementById('status-text').innerText = "מוכן לסריקה!";
            } catch (err) {
                document.getElementById('status-text').innerText = "שגיאה בהחלפת מצלמה";
            }
        }

        async function updateUiAndLoad() {
            const switchBtn = document.getElementById('quick-switch-btn');
            if (currentMode === 'beard') {
                document.getElementById('scanner-title').innerText = "בדיקת פטור זקן";
                switchBtn.innerText = "🔄 מעבר לבדיקת פטור שיער";
                await loadData(urlBeardSheet);
            } else {
                document.getElementById('scanner-title').innerText = "בדיקת פטור שיער";
                switchBtn.innerText = "🔄 מעבר לבדיקת פטור זקן";
                await loadData(urlHairSheet);
            }
        }

        async function loadData(url) {
            if(!url || url.startsWith("הדבק_כאן")) {
                document.getElementById('status-text').innerHTML = "⚠️ חסרים קישורים בשורות 188-189";
                return;
            }
            try {
                document.getElementById('status-text').innerText = "טוען נתונים...";
                const response = await fetch(url);
                const data = await response.text();
                
                validBarcodes = data.split(/\r?\n/)
                                    .map(line => line.trim())
                                    .filter(line => line.length > 0);
                
                if(validBarcodes[0] && validBarcodes[0].toLowerCase() === 'barcode') {
                    validBarcodes.shift();
                }
                document.getElementById('status-text').innerText = `המערכת מוכנה! נטענו ${validBarcodes.length} פטורים.`;
            } catch (error) {
                document.getElementById('status-text').innerText = "❌ שגיאה בגישה לגוגל שיטס";
            }
        }

        async function toggleMode() {
            currentMode = (currentMode === 'beard') ? 'hair' : 'beard';
            validBarcodes = [];
            document.getElementById('manual-barcode').value = "";
            await updateUiAndLoad();
        }

        function submitManualCode() {
            const inputEl = document.getElementById('manual-barcode');
            const code = inputEl.value.trim();
            if (code.length === 0) return;
            checkAndShowResult(code);
        }

        function onScanSuccess(decodedText) {
            if (isProcessing) return;
            isProcessing = true;
            checkAndShowResult(decodedText);
        }

        function checkAndShowResult(rawCode) {
            const cleanCode = rawCode.trim();
            const resultScreen = document.getElementById('result-screen');
            const resultTitle = document.getElementById('result-title');
            const resultSub = document.getElementById('result-sub');
            const resultCode = document.getElementById('result-code');

            const isType = (currentMode === 'beard') ? "פטור זקן" : "פטור שיער";

            if (validBarcodes.includes(cleanCode)) {
                resultScreen.style.backgroundColor = "#22c55e"; 
                resultTitle.innerText = "פטור בתוקף";
                resultSub.innerText = `מאושר: ${isType}`;
            } else {
                resultScreen.style.backgroundColor = "#ef4444"; 
                resultTitle.innerText = "ללא פטור";
                resultSub.innerText = `לא נמצא ברשימת ${isType}`;
            }

            resultCode.innerText = `מספר שנבדק: ${cleanCode}`;
            resultScreen.style.display = 'flex';
        }

        function resetScanner() {
            document.getElementById('manual-barcode').value = "";
            document.getElementById('result-screen').style.display = 'none';
            setTimeout(() => {
                isProcessing = false;
            }, 800);
        }
    </script>
</body>
</html>
