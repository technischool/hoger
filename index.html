<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת בדיקת פטורים</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #0a192f; 
            transition: background-color 0.3s ease;
        }
        .card {
            width: 90%;
            max-width: 500px;
            text-align: center;
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        h1 { color: #1f2937; margin-bottom: 25px; font-size: 26px; }
        .status-text { font-size: 14px; color: #6b7280; margin-bottom: 20px; }
        
        /* עיצוב מסך הבית - כפתורי בחירה גדולים */
        #menu-screen { display: flex; flex-direction: column; gap: 15px; }
        .menu-btn {
            background-color: #1e3a8a;
            color: white;
            border: none;
            padding: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s ease, background-color 0.2s;
        }
        .menu-btn:active { transform: scale(0.98); }
        .menu-btn:hover { background-color: #2563eb; }

        /* מסך הסורק */
        #scanner-screen { display: none; }
        #reader { width: 100%; border-radius: 10px; overflow: hidden; border: none !important; }
        #reader button {
            background-color: #2563eb; color: white; border: none; padding: 12px 24px;
            font-size: 16px; border-radius: 8px; cursor: pointer; margin: 10px 0; font-weight: bold;
        }
        
        /* כפתור החלפה מהירה בין פטורים בתחתית הסורק */
        .switch-btn {
            background-color: #f3f4f6; border: 2px solid #1e3a8a; color: #1e3a8a; padding: 12px 20px;
            border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 20px; width: 100%;
            font-size: 1rem; transition: background-color 0.2s;
        }
        .switch-btn:hover { background-color: #e0e7ff; }

        /* מסך תוצאה מלא שיקפוץ בצבע */
        #result-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            flex-direction: column; align-items: center; justify-content: center; z-index: 9999;
            color: white; text-align: center;
        }
        #result-title { font-size: 3.5rem; margin: 0; font-weight: bold; }
        #result-sub { font-size: 1.8rem; margin: 10px 0; opacity: 0.9; }
        #result-code { font-size: 1.3rem; margin: 0 0 40px 0; opacity: 0.7; }
        #reset-btn {
            background: white; color: black; border: none; padding: 15px 45px;
            font-size: 1.3rem; font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="menu-screen" class="card">
        <h1>מערכת בדיקת פטורים</h1>
        <button class="menu-btn" onclick="selectMode('beard')">בדיקת פטור זקן</button>
        <button class="menu-btn" onclick="selectMode('hair')">בדיקת פטור שיער</button>
    </div>

    <div id="scanner-screen" class="card">
        <h1 id="scanner-title">סורק</h1>
        <div id="status-text" class="status-text">טוען נתונים...</div>
        <div id="reader"></div>
        
        <button id="quick-switch-btn" class="switch-btn" onclick="toggleMode()">מעבר לבדיקה שנייה...</button>
    </div>

    <div id="result-screen">
        <h2 id="result-title"></h2>
        <div id="result-sub"></div>
        <p id="result-code"></p>
        <button id="reset-btn" onclick="resetScanner()">סרוק כרטיס הבא</button>
    </div>

    <script>
        // ========================================================
        // ⚠️ הדבק כאן את שני הקישורים השונים שלך מגוגל שיטס:
        // ========================================================
        const urlBeardSheet = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQrdgt4ZneC376JbsyxK4aXb_5dmq67zJWZo96WTZ2pKW8HV7eLPXn2a5B8KMmiHAjoaGV4p-U10YCr/pub?output=csv"; 
        const urlHairSheet = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRoy_KcjTmaxtQGXGd00oe1rtF_QI_oXjhgeI-UAkQeskU8Ujw13ehzjxUoqM_XTFczg4EdRwf9-4A8/pub?output=csv"; 
        
        let validBarcodes = [];
        let html5QrcodeScanner = null;
        let currentMode = ''; 

        // פונקציה לבחירת סוג הפטור ומעבר לסורק
        async function selectMode(mode) {
            currentMode = mode;
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('scanner-screen').style.display = 'block';
            
            await updateUiAndLoad();
        }

        // עדכון כותרות הממשק וטעינת הקובץ הנכון
        async function updateUiAndLoad() {
            const switchBtn = document.getElementById('quick-switch-btn');
            
            if (currentMode === 'beard') {
                document.getElementById('scanner-title').innerText = "בדיקת פטור זקן";
                switchBtn.innerText = "🔄 מעבר לבדיקת פטור שיער";
                await loadBarcodes(urlBeardSheet);
            } else if (currentMode === 'hair') {
                document.getElementById('scanner-title').innerText = "בדיקת פטור שיער";
                switchBtn.innerText = "🔄 מעבר לבדיקת פטור זקן";
                await loadBarcodes(urlHairSheet);
            }
        }

        // פונקציית החלפה מהירה בלחיצת כפתור בתחתית - מתוקנת למניעת השגיאה!
        async function toggleMode() {
            document.getElementById('status-text').innerText = "מכבה מצלמה קודמת...";
            
            // הגנה חזקה מפני שגיאות removeChild
            if (html5QrcodeScanner) {
                try {
                    await html5QrcodeScanner.clear();
                } catch (err) {
                    console.log("התעלם משגיאת ניקוי פנימית:", err);
                }
                html5QrcodeScanner = null;
            }
            
            // איפוס ידני של אלמנט ה-HTML של הreader כדי לנקות שאריות תקועות
            document.getElementById('reader').innerHTML = "";
            
            // החלפת המצב
            currentMode = (currentMode === 'beard') ? 'hair' : 'beard';
            validBarcodes = [];
            
            // טעינה מחדש של הקובץ השני והפעלת המצלמה
            await updateUiAndLoad();
        }

        // משיכת הנתונים מהקובץ
        async function loadBarcodes(url) {
            if(url.startsWith("הדבק_כאן")) {
                document.getElementById('status-text').innerHTML = "⚠️ יש להדביק את הקישור המתאים בקוד (שורות 99-100)";
                return;
            }
            try {
                document.getElementById('status-text').innerText = "מתחבר לבסיס הנתונים...";
                const response = await fetch(url);
                const data = await response.text();
                
                validBarcodes = data.split(/\r?\n/)
                                    .map(line => line.trim())
                                    .filter(line => line.length > 0);
                
                if(validBarcodes[0] && validBarcodes[0].toLowerCase() === 'barcode') {
                    validBarcodes.shift();
                }

                document.getElementById('status-text').innerText = `המערכת מוכנה! נטענו ${validBarcodes.length} רשומות.`;
                startScanner();
            } catch (error) {
                document.getElementById('status-text').innerText = "❌ שגיאה בסנכרון מול גוגל שיטס";
                console.error(error);
            }
        }

        // הפעלת המצלמה - כולל יצירה מחדש נקייה
        function startScanner() {
            // תמיד ניצור אובייקט סורק חדש לחלוטין כדי למנוע זיכרון תקוע
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
                fps: 10, 
                qrbox: { width: 280, height: 160 },
                rememberLastUsedCamera: true
            });
            html5QrcodeScanner.render(onScanSuccess, onScanError);
        }

        function onScanError(err) {
            // פונקציית דמי ריקה כדי למנוע הצפת שגיאות קטנות בקונסול בזמן שהמצלמה מחפשת ברקוד
        }

        // פענוח והצגת תוצאה (ירוק/אדום)
        async function onScanSuccess(decodedText) {
            if (html5QrcodeScanner) {
                try { await html5QrcodeScanner.clear(); } catch(e){}
                html5QrcodeScanner = null;
            }

            const cleanCode = decodedText.trim();
            const resultScreen = document.getElementById('result-screen');
            const resultTitle = document.getElementById('result-title');
            const resultSub = document.getElementById('result-sub');
            const resultCode = document.getElementById('result-code');

            const isType = (currentMode === 'beard') ? "פטור זקן" : "פטור שיער";

            if (validBarcodes.includes(cleanCode)) {
                resultScreen.style.backgroundColor = "#22c55e"; 
                resultTitle.innerText = "פטור בתוקף";
                resultSub.innerText = `מאושר: ${isType}`;
            } else {
                resultScreen.style.backgroundColor = "#ef4444"; 
                resultTitle.innerText = "ללא פטור";
                resultSub.innerText = `לא נמצא ברשימת ${isType}`;
            }

            resultCode.innerText = `מספר כרטיס: ${cleanCode}`;
            resultScreen.style.display = 'flex';
        }

        // חזרה לסריקה הבאה - נשאר באותו פטור בדיוק ובאותו מסך
        function resetScanner() {
            document.getElementById('reader').innerHTML = ""; // ניקוי אלמנט
            document.getElementById('result-screen').style.display = 'none';
            startScanner();
        }
    </script>
</body>
</html>
