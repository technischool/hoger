<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת בדיקת פטורים</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #0a192f; 
        }
        .card {
            width: 90%;
            max-width: 500px;
            text-align: center;
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        h1 { color: #1f2937; margin-bottom: 25px; font-size: 26px; }
        .status-text { font-size: 14px; color: #6b7280; margin-bottom: 20px; font-weight: bold; }
        
        /* עיצוב בחירת המצלמות */
        .camera-select-container {
            margin-bottom: 15px;
            text-align: right;
        }
        .camera-select-container label {
            font-size: 13px;
            color: #4b5563;
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .cam-select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #1e3a8a;
            font-size: 1rem;
            background-color: #f9fafb;
            color: #1f2937;
        }

        /* מסך הבית */
        #menu-screen { display: flex; flex-direction: column; gap: 15px; }
        .menu-btn {
            background-color: #1e3a8a; color: white; border: none; padding: 20px;
            font-size: 1.3rem; font-weight: bold; border-radius: 12px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* מסך הסורק */
        #scanner-screen { display: none; }
        #reader { width: 100%; border-radius: 10px; overflow: hidden; border: none !important; }
        #reader button { display: none !important; }

        /* כפתור החלפה מהירה בתחתית */
        .switch-btn {
            background-color: #f3f4f6; border: 2px solid #1e3a8a; color: #1e3a8a; padding: 12px 20px;
            border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 20px; width: 100%;
            font-size: 1rem;
        }

        /* מסך תוצאה מלא */
        #result-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            flex-direction: column; align-items: center; justify-content: center; z-index: 9999;
            color: white; text-align: center;
        }
        #result-title { font-size: 3.5rem; margin: 0; font-weight: bold; }
        #result-sub { font-size: 1.8rem; margin: 10px 0; opacity: 0.9; }
        #result-code { font-size: 1.3rem; margin: 0 0 40px 0; opacity: 0.7; }
        #reset-btn {
            background: white; color: black; border: none; padding: 15px 45px;
            font-size: 1.3rem; font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="menu-screen" class="card">
        <h1>מערכת בדיקת פטורים</h1>
        <button class="menu-btn" onclick="selectMode('beard')">בדיקת פטור זקן</button>
        <button class="menu-btn" onclick="selectMode('hair')">בדיקת פטור שיער</button>
    </div>

    <div id="scanner-screen" class="card">
        <h1 id="scanner-title">סורק</h1>
        
        <div class="camera-select-container">
            <label for="camera-select">🎥 בחר מצלמה אחורית חדה:</label>
            <select id="camera-select" class="cam-select" onchange="onCameraChange()"></select>
        </div>

        <div id="status-text" class="status-text">טוען נתונים...</div>
        <div id="reader"></div>
        <button id="quick-switch-btn" class="switch-btn" onclick="toggleMode()">מעבר לבדיקה שנייה...</button>
    </div>

    <div id="result-screen">
        <h2 id="result-title"></h2>
        <div id="result-sub"></div>
        <p id="result-code"></p>
        <button id="reset-btn" onclick="resetScanner()">סרוק כרטיס הבא</button>
    </div>

    <script>
        // ========================================================
        // ⚠️ הדבק כאן את שני הקישורים השונים שלך מגוגל שיטס:
        // ========================================================
        const urlBeardSheet = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQrdgt4ZneC376JbsyxK4aXb_5dmq67zJWZo96WTZ2pKW8HV7eLPXn2a5B8KMmiHAjoaGV4p-U10YCr/pub?output=csv"; 
        const urlHairSheet = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRoy_KcjTmaxtQGXGd00oe1rtF_QI_oXjhgeI-UAkQeskU8Ujw13ehzjxUoqM_XTFczg4EdRwf9-4A8/pub?output=csv"; 
        
        let validBarcodes = [];
        let html5QrCode = null;
        let currentMode = ''; 
        let isProcessing = false;
        let selectedCameraId = null;

        // בחירת מצב התחלתי
        async function selectMode(mode) {
            currentMode = mode;
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('scanner-screen').style.display = 'block';
            
            // גילוי המצלמות הקיימות במכשיר והפעלת הראשונה ברשימה
            await getAndPopulateCameras();
            await updateUiAndLoad();
        }

        // גילוי מצלמות והזנתן לתפריט הבחירה
        function getAndPopulateCameras() {
            return new Promise((resolve) => {
                Html5Qrcode.getCameras().then(cameras => {
                    const selectEl = document.getElementById('camera-select');
                    selectEl.innerHTML = ""; // ניקוי

                    if (cameras && cameras.length > 0) {
                        // סינון המצלמות ומילוי התפריט
                        cameras.forEach((camera, index) => {
                            const option = document.createElement('option');
                            option.value = camera.id;
                            option.text = camera.label || `מצלמה ${index + 1}`;
                            selectEl.appendChild(option);
                        });
                        
                        // בחירת המצלמה האחרונה בדרך כלל היא הראשית האחורית בטלפונים
                        selectEl.selectedIndex = cameras.length - 1;
                        selectedCameraId = selectEl.value;
                        
                        startCamera(selectedCameraId).then(() => resolve());
                    } else {
                        document.getElementById('status-text').innerText = "⚠️ לא נמצאו מצלמות זמינות";
                        resolve();
                    }
                }).catch(err => {
                    console.error("שגיאה בגילוי מצלמות:", err);
                    document.getElementById('status-text').innerText = "⚠️ שגיאה בהרשאות המצלמה";
                    resolve();
                });
            });
        }

        // הפעלת מצלמה ספציפית לפי ה-ID שנבחר
        function startCamera(cameraId) {
            if (html5QrCode) {
                // אם כבר יש סורק רץ, נכבה אותו קודם בצורה בטוחה
                return html5QrCode.stop().then(() => {
                    html5QrCode = new Html5Qrcode("reader");
                    return html5QrCode.start(cameraId, { fps: 15, qrbox: { width: 280, height: 160 } }, onScanSuccess);
                }).catch(() => {
                    html5QrCode = new Html5Qrcode("reader");
                    return html5QrCode.start(cameraId, { fps: 15, qrbox: { width: 280, height: 160 } }, onScanSuccess);
                });
            } else {
                html5QrCode = new Html5Qrcode("reader");
                return html5QrCode.start(cameraId, { fps: 15, qrbox: { width: 280, height: 160 } }, onScanSuccess);
            }
        }

        // אירוע שינוי מצלמה ידני מהתפריט
        async function onCameraChange() {
