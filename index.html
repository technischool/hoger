<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת בדיקת פטורים</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #0a192f; 
        }
        .card {
            width: 90%;
            max-width: 500px;
            text-align: center;
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        h1 { color: #1f2937; margin-bottom: 25px; font-size: 26px; }
        .status-text { font-size: 14px; color: #6b7280; margin-bottom: 20px; font-weight: bold; }
        
        /* מסך הבית */
        #menu-screen { display: flex; flex-direction: column; gap: 15px; }
        .menu-btn {
            background-color: #1e3a8a; color: white; border: none; padding: 20px;
            font-size: 1.3rem; font-weight: bold; border-radius: 12px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* מסך הסורק */
        #scanner-screen { display: none; }
        #reader { width: 100%; border-radius: 10px; overflow: hidden; border: none !important; }
        
        /* הסתרת כפתורים מיותרים של הספרייה */
        #reader button { display: none !important; }

        /* כפתור החלפה מהירה בתחתית */
        .switch-btn {
            background-color: #f3f4f6; border: 2px solid #1e3a8a; color: #1e3a8a; padding: 12px 20px;
            border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 20px; width: 100%;
            font-size: 1rem;
        }

        /* מסך תוצאה מלא שיקפוץ מעל */
        #result-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            flex-direction: column; align-items: center; justify-content: center; z-index: 9999;
            color: white; text-align: center;
        }
        #result-title { font-size: 3.5rem; margin: 0; font-weight: bold; }
        #result-sub { font-size: 1.8rem; margin: 10px 0; opacity: 0.9; }
        #result-code { font-size: 1.3rem; margin: 0 0 40px 0; opacity: 0.7; }
        #reset-btn {
            background: white; color: black; border: none; padding: 15px 45px;
            font-size: 1.3rem; font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="menu-screen" class="card">
        <h1>מערכת בדיקת פטורים</h1>
        <button class="menu-btn" onclick="selectMode('beard')">בדיקת פטור זקן</button>
        <button class="menu-btn" onclick="selectMode('hair')">בדיקת פטור שיער</button>
    </div>

    <div id="scanner-screen" class="card">
        <h1 id="scanner-title">סורק</h1>
        <div id="status-text" class="status-text">טוען נתונים...</div>
        <div id="reader"></div>
        <button id="quick-switch-btn" class="switch-btn" onclick="toggleMode()">מעבר לבדיקה שנייה...</button>
    </div>

    <div id="result-screen">
        <h2 id="result-title"></h2>
        <div id="result-sub"></div>
        <p id="result-code"></p>
        <button id="reset-btn" onclick="resetScanner()">סרוק כרטיס הבא</button>
    </div>

    <script>
        // ========================================================
        // ⚠️ הדבק כאן את שני הקישורים השונים שלך מגוגל שיטס:
        // ========================================================
        const urlBeardSheet = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQrdgt4ZneC376JbsyxK4aXb_5dmq67zJWZo96WTZ2pKW8HV7eLPXn2a5B8KMmiHAjoaGV4p-U10YCr/pub?output=csv"; 
        const urlHairSheet = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRoy_KcjTmaxtQGXGd00oe1rtF_QI_oXjhgeI-UAkQeskU8Ujw13ehzjxUoqM_XTFczg4EdRwf9-4A8/pub?output=csv"; 
        
        let validBarcodes = [];
        let html5QrCode = null;
        let currentMode = ''; 
        let isProcessing = false;

        // בחירת מצב התחלתי
        async function selectMode(mode) {
            currentMode = mode;
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('scanner-screen').style.display = 'block';
            
            // הפעלת המצלמה פעם אחת בלבד כאן
            await startCamera();
            await updateUiAndLoad();
        }

        // החלפת רשימות ברקע בלי לגעת במצלמה
        async function updateUiAndLoad() {
            const switchBtn = document.getElementById('quick-switch-btn');
            if (currentMode === 'beard') {
                document.getElementById('scanner-title').innerText = "בדיקת פטור זקן";
                switchBtn.innerText = "🔄 מעבר לבדיקת פטור שיער";
                await loadData(urlBeardSheet);
            } else {
                document.getElementById('scanner-title').innerText = "בדיקת פטור שיער";
                switchBtn.innerText = "🔄 מעבר לבדיקת פטור זקן";
                await loadData(urlHairSheet);
            }
        }

        // טעינת הנתונים מגוגל שיטס
        async function loadData(url) {
            if(url.startsWith("הדבק_כאן")) {
                document.getElementById('status-text').innerHTML = "⚠️ יש להדביק את הקישור בקוד (שורות 96-97)";
                return;
            }
            try {
                document.getElementById('status-text').innerText = "מעדכן רשימת ברקודים...";
                const response = await fetch(url);
                const data = await response.text();
                
                validBarcodes = data.split(/\r?\n/)
                                    .map(line => line.trim())
                                    .filter(line => line.length > 0);
                
                if(validBarcodes[0] && validBarcodes[0].toLowerCase() === 'barcode') {
                    validBarcodes.shift();
                }
                document.getElementById('status-text').innerText = `מוכן! נטענו ${validBarcodes.length} רשומות קבילות.`;
            } catch (error) {
                document.getElementById('status-text').innerText = "❌ שגיאה בסנכרון מול גוגל שיטס";
                console.error(error);
            }
        }

        // הפעלת המצלמה בצורה אמינה עם הגדרה ישירה למצלמה אחורית
        function startCamera() {
            return new Promise((resolve) => {
                html5QrCode = new Html5Qrcode("reader");
                const config = { fps: 15, qrbox: { width: 280, height: 160 } };
                
                // כפיית מצלמה אחורית בלבד סוגר את תקלות הזיהוי
                html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
                    .then(() => resolve())
                    .catch((err) => {
                        document.getElementById('status-text').innerText = "⚠️ שגיאה בגישה למצלמה. אנא ודא שאישרת הרשאות.";
                        resolve();
                    });
            });
        }

        // מעבר מהיר - משנה רק את הזיכרון, המצלמה ממשיכה לרוץ חלק
        async function toggleMode() {
            currentMode = (currentMode === 'beard') ? 'hair' : 'beard';
            validBarcodes = [];
            await updateUiAndLoad();
        }

        // פענוח הברקוד
        function onScanSuccess(decodedText) {
            // אם המערכת כרגע מציגה תוצאה, תתעלם מסריקות נוספות ברקע
            if (isProcessing) return;
            isProcessing = true;

            const cleanCode = decodedText.trim();
            const resultScreen = document.getElementById('result-screen');
            const resultTitle = document.getElementById('result-title');
            const resultSub = document.getElementById('result-sub');
            const resultCode = document.getElementById('result-code');

            const isType = (currentMode === 'beard') ? "פטור זקן" : "פטור שיער";

            if (validBarcodes.includes(cleanCode)) {
                resultScreen.style.backgroundColor = "#22c55e"; 
                resultTitle.innerText = "פטור בתוקף";
                resultSub.innerText = `מאושר: ${isType}`;
            } else {
                resultScreen.style.backgroundColor = "#ef4444"; 
                resultTitle.innerText = "ללא פטור";
                resultSub.innerText = `לא נמצא ברשימת ${isType}`;
            }

            resultCode.innerText = `מספר כרטיס: ${cleanCode}`;
            resultScreen.style.display = 'flex';
        }

        // חזרה לסריקה הבאה - מיידית, המצלמה לא עשתה restart
        function resetScanner() {
            document.getElementById('result-screen').style.display = 'none';
            // השהיה קטנה רק כדי שהיוזר יספיק להזיז את היד מהכרטיס הקודם
            setTimeout(() => {
                isProcessing = false;
            }, 800);
        }
    </script>
</body>
</html>
